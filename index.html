<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a36"><title>Gourmap – Lezzet Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css?v=2"></head><body>
<header class="hero"><div class="top"><div class="logo">🍽️ <b>Gour</b>map</div>
<select id="lang" aria-label="lang"><option value="tr">🇹🇷 TR</option><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option></select></div>
<p class="tagline" data-t="tagline"></p>
<div class="searchbar"><span>📍</span><input id="city" value="Vienne" autocomplete="off"><button id="geo" title="GPS">🎯</button></div>
<div id="places"></div></header>
<main>
<section class="panel">
<div class="h"><span data-t="likes"></span><small data-t="likeshint"></small></div>
<div id="cuisines" class="chips"></div>
<div class="radius"><span data-t="radius"></span><b><span id="rv">10</span> km</b></div><input type="range" id="radius" min="1" max="30" value="10">
<details class="filters"><summary>⚙️ <span data-t="filters"></span></summary>
<div class="h" data-t="dislikes"></div><div id="nocuisines" class="chips small"></div>
<div class="grid"><label><span data-t="diet"></span><select id="diet"><option value="">—</option><option value="halal">☪️ Helal</option><option value="vegetarian">🥗 Vejetaryen</option><option value="vegan">🌱 Vegan</option><option value="gluten_free">🌾 Glutensiz</option></select></label>
<label><span data-t="budget"></span><select id="budget"><option value="">—</option><option>€</option><option>€€</option><option>€€€</option></select></label>
<label><span data-t="max"></span><input type="number" id="max" value="10" min="1" max="50"></label></div>
<label class="switch"><input type="checkbox" id="opennow"> <span data-t="opennow"></span></label>
</details>
<button id="go" class="primary">🔍 <span data-t="search"></span></button>
</section>
<div id="status"></div>
<div id="map"></div>
<div id="results"></div>
<p class="foot">Veri © OpenStreetMap contributors · <span data-t="foot"></span></p>
</main><script src="app.js?v=2"></script></body></html>
